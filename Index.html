<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamin AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      padding: 30px 0;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .status {
      color: #8e8e93;
      margin-top: 8px;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .message {
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #27272d;
      margin-left: 35px;
    }

    .ai {
      background: #17171c;
      margin-right: 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      position: sticky;
      bottom: 0;
      background: #0b0b0f;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #303038;
      background: #17171c;
      color: white;
      border-radius: 18px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: 600;
      font-size: 15px;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🧠</div>
    <h1>Benjamin AI</h1>
    <div class="status">Personal AI Agent • Ready</div>
  </div>

  <div id="chat" class="chat">

    <div class="message ai">
      Hello. I'm your personal AI agent.

      Tell me what you want me to do.
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="input"
      rows="1"
      placeholder="Ask your AI agent..."
    ></textarea>

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

</div>

<script>

async function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (!message) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;

  chat.appendChild(userMessage);

  input.value = "";

  const thinking = document.createElement("div");
  thinking.className = "message ai";
  thinking.textContent = "🧠 Thinking...";

  chat.appendChild(thinking);

  chat.scrollTop = chat.scrollHeight;

  /*
    AI CONNECTION WILL BE ADDED NEXT.

    We will connect this interface
    to your AI model without putting
    your private API key directly
    into this page.
  */

  setTimeout(() => {

    thinking.textContent =
      "Your agent interface is working.\n\nNext we'll connect the AI brain.";

    chat.scrollTop = chat.scrollHeight;

  }, 800);

}

</script>

</body>
</html>
