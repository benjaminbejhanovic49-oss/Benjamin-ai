<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamin AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 750px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .logo {
      font-size: 48px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .status {
      color: #8e8e93;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 20px;
    }

    .message {
      padding: 15px 17px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai {
      background: #17171c;
      margin-right: 20px;
    }

    .user {
      background: #29292f;
      margin-left: 35px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px 0;
      background: #08080c;
    }

    textarea {
      flex: 1;
      min-height: 50px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303038;
      border-radius: 18px;
      background: #17171c;
      color: white;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 18px;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: 700;
      padding: 0 15px;
      min-width: 55px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #mic {
      background: #25252c;
      color: white;
      font-size: 20px;
      min-width: 55px;
    }

    #mic.listening {
      background: #555;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🧠</div>
    <h1>Benjamin AI</h1>
    <div class="status" id="status">
      Personal AI Agent • Online
    </div>
  </div>

  <div id="chat" class="chat">

    <div class="message ai">
      Hello. I'm Benjamin AI.

      Press 🎙️ and talk to me.
    </div>

  </div>

  <div class="input-area">

    <button id="mic" type="button">🎙️</button>

    <textarea
      id="input"
      placeholder="Talk to Benjamin..."
      rows="1"
    ></textarea>

    <button id="send" type="button">Send</button>

  </div>

</div>

<script>

const API_URL =
  "https://benjamin-ai-api.vercel.app/api/chat";

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const chat =
  document.getElementById("chat");

const status =
  document.getElementById("status");


// ==================================================
// VOICE INPUT
// ==================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let listening = false;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;

  recognition.lang = "en-US";


  recognition.onstart = function() {

    listening = true;

    mic.classList.add("listening");

    mic.textContent = "🔴";

    status.textContent =
      "Benjamin AI • Listening...";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    status.textContent =
      "Benjamin AI • Ready";

    sendMessage();

  };


  recognition.onerror = function(event) {

    listening = false;

    mic.classList.remove("listening");

    mic.textContent = "🎙️";

    status.textContent =
      "Microphone error: " + event.error;

  };


  recognition.onend = function() {

    listening = false;

    mic.classList.remove("listening");

    mic.textContent = "🎙️";

    if (!status.textContent.includes("error")) {

      status.textContent =
        "Benjamin AI • Online";

    }

  };


  mic.addEventListener("click", function() {

    if (listening) {

      recognition.stop();

      return;

    }

    recognition.start();

  });

} else {

  mic.addEventListener("click", function() {

    alert(
      "Voice recognition is not supported by this browser."
    );

  });

}


// ==================================================
// SEND MESSAGE
// ==================================================

send.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();

  }

});


async function sendMessage() {

  const message =
    input.value.trim();

  if (!message) {

    return;

  }


  // USER MESSAGE

  const user =
    document.createElement("div");

  user.className =
    "message user";

  user.textContent =
    message;

  chat.appendChild(user);


  input.value = "";

  send.disabled = true;

  mic.disabled = true;


  // THINKING

  const thinking =
    document.createElement("div");

  thinking.className =
    "message ai";

  thinking.textContent =
    "🧠 Thinking...";

  chat.appendChild(thinking);

  chat.scrollTop =
    chat.scrollHeight;


  status.textContent =
    "Benjamin AI • Thinking...";


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          messages: [

            {
              role: "system",

              content:
                "You are Benjamin AI, a personal AI assistant inspired by JARVIS. Speak naturally, be intelligent, helpful and concise. Give practical answers."
            },

            {
              role: "user",

              content: message

            }

          ]

        })

      });


    const data =
      await response.json();


    thinking.remove();


    const answer =
      document.createElement("div");

    answer.className =
      "message ai";


    let text = "";


    if (data.answer) {

      text = data.answer;

    }

    else if (data.error) {

      text =
        typeof data.error === "string"
          ? data.error
          : (
              data.error.message ||
              JSON.stringify(data.error)
            );

    }

    else {

      text =
        "I didn't receive an answer.";

    }


    answer.textContent =
      text;

    chat.appendChild(answer);

    chat.scrollTop =
      chat.scrollHeight;


    // ==================================================
    // SPOKEN REPLY
    // ==================================================

    speak(text);


    status.textContent =
      "Benjamin AI • Online";

  }

  catch (error) {

    thinking.textContent =
      "Connection error: " +
      error.message;

    status.textContent =
      "Benjamin AI • Error";

  }


  send.disabled = false;

  mic.disabled = false;

  input.focus();

}


// ==================================================
// TEXT TO SPEECH
// ==================================================

function speak(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  speechSynthesis.cancel();


  const cleanText =
    text
      .replace(/[*#_`]/g, "")
      .replace(/\n+/g, " ")
      .trim();


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  utterance.lang =
    "en-US";

  utterance.rate =
    1.0;

  utterance.pitch =
    0.9;

  utterance.volume =
    1.0;


  const voices =
    speechSynthesis.getVoices();


  const preferredVoice =
    voices.find(function(voice) {

      return (
        voice.lang.startsWith("en") &&
        (
          voice.name.includes("Siri") ||
          voice.name.includes("Alex") ||
          voice.name.includes("Daniel")
        )
      );

    });


  if (preferredVoice) {

    utterance.voice =
      preferredVoice;

  }


  speechSynthesis.speak(
    utterance
  );

}


// Load voices when iPhone makes them available

if (
  "speechSynthesis" in window &&
  speechSynthesis.onvoiceschanged !== undefined
) {

  speechSynthesis.onvoiceschanged =
    function() {

      speechSynthesis.getVoices();

    };

}

</script>

</body>
</html>
