<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamin AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      padding: 30px 0;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .status {
      color: #8e8e93;
      margin-top: 8px;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .message {
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #27272d;
      margin-left: 35px;
    }

    .ai {
      background: #17171c;
      margin-right: 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      position: sticky;
      bottom: 0;
      background: #0b0b0f;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #303038;
      background: #17171c;
      color: white;
      border-radius: 18px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #55555f;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: 600;
      font-size: 15px;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🧠</div>
    <h1>Benjamin AI</h1>
    <div class="status">Personal AI Agent • Ready</div>
  </div>

  <div id="chat" class="chat">

    <div class="message ai">
      Hello. I'm your personal AI agent.

      Tell me what you want me to do.
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="input"
      rows="1"
      placeholder="Ask your AI agent..."
    ></textarea>

    <button id="sendButton" onclick="sendMessage()">
      Send
    </button>

  </div>

</div>

<script>

async function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const button = document.getElementById("sendButton");

  const message = input.value.trim();

  if (!message) return;

  // Show user message
  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;

  chat.appendChild(userMessage);

  input.value = "";

  // Disable button while AI is thinking
  button.disabled = true;

  // Show thinking message
  const thinking = document.createElement("div");
  thinking.className = "message ai";
  thinking.textContent = "🧠 Thinking...";

  chat.appendChild(thinking);

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(
      "https://benjamin-ai-api.vercel.app/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          messages: [

            {
              role: "system",
              content:
                "You are Benjamin AI, a helpful personal AI agent. Be intelligent, clear, practical and concise."
            },

            {
              role: "user",
              content: message
            }

          ]

        })
      }
    );

    const data = await response.json();

    // Remove thinking message
    thinking.remove();

    // Create AI response
    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";

    const answer =
      data.choices?.[0]?.message?.content ||
      data.error ||
      "I couldn't get a response from the AI.";

    aiMessage.textContent = answer;

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

  } catch (error) {

    thinking.textContent =
      "Connection error: " + error.message;

    chat.scrollTop = chat.scrollHeight;

  }

  button.disabled = false;
}


// Press Enter to send
document.getElementById("input").addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});

</script>

</body>
</html>
