<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Benjamin AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08080c;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 750px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .logo {
      font-size: 48px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .status {
      color: #8e8e93;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 20px;
    }

    .message {
      padding: 15px 17px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai {
      background: #17171c;
      margin-right: 20px;
    }

    .user {
      background: #29292f;
      margin-left: 35px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      background: #08080c;
    }

    textarea {
      flex: 1;
      min-height: 50px;
      max-height: 150px;
      resize: none;
      border: 1px solid #303038;
      border-radius: 18px;
      background: #17171c;
      color: white;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #666;
    }

    button {
      min-width: 70px;
      border: 0;
      border-radius: 18px;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: 700;
      padding: 0 18px;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🧠</div>
    <h1>Benjamin AI</h1>
    <div class="status" id="status">
      Personal AI Agent • Online
    </div>
  </div>

  <div id="chat" class="chat">

    <div class="message ai">
      Hello. I'm Benjamin AI.

      I'm ready. What do you need?
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="input"
      placeholder="Talk to Benjamin AI..."
      rows="1"
    ></textarea>

    <button id="send">
      Send
    </button>

  </div>

</div>

<script>

const API_URL = "https://benjamin-ai-api.vercel.app/api/chat";

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const status = document.getElementById("status");

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});


async function sendMessage() {

  const message = input.value.trim();

  if (!message) {
    return;
  }

  // Show user message

  const user = document.createElement("div");

  user.className = "message user";

  user.textContent = message;

  chat.appendChild(user);

  input.value = "";

  // Disable button

  send.disabled = true;

  status.textContent = "Benjamin AI • Thinking...";


  // Thinking message

  const thinking = document.createElement("div");

  thinking.className = "message ai";

  thinking.textContent = "🧠 Thinking...";

  chat.appendChild(thinking);

  chat.scrollTop = chat.scrollHeight;


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        messages: [

          {
            role: "system",
            content:
              "You are Benjamin AI, a personal AI assistant inspired by JARVIS. You are helpful, intelligent, concise and practical. Speak naturally. Help the user accomplish tasks instead of only explaining things."
          },

          {
            role: "user",
            content: message
          }

        ]

      })

    });


    const data = await response.json();

    thinking.remove();


    const answer = document.createElement("div");

    answer.className = "message ai";


    if (data.answer) {

      answer.textContent = data.answer;

    }

    else if (data.error) {

      if (typeof data.error === "string") {

        answer.textContent =
          "AI Error: " + data.error;

      }

      else {

        answer.textContent =
          "AI Error: " +
          (data.error.message ||
           JSON.stringify(data.error));

      }

    }

    else {

      answer.textContent =
        "The AI returned no answer.";

    }


    chat.appendChild(answer);

    chat.scrollTop = chat.scrollHeight;


    status.textContent =
      "Personal AI Agent • Online";

  }

  catch (error) {

    thinking.textContent =
      "Connection error.\n\n" +
      error.message;

    status.textContent =
      "Personal AI Agent • Connection Error";

  }


  send.disabled = false;

  input.focus();

}

</script>

</body>
</html>
